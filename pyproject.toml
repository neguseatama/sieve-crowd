[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-crowd"
version = "0.2.0"
description = "Make every record one of a crowd, and measure it: deterministic, offline k-anonymity for CSV, JSON and XML tables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kai IWASAKI" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-crowd"
Repository = "https://github.com/neguseatama/sieve-crowd.git"
"Bug Tracker" = "https://github.com/neguseatama/sieve-crowd/issues"

[project.scripts]
sieve-crowd = "sieve_crowd.cli:main"

[tool.setuptools]
packages = ["sieve_crowd"]
