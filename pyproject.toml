[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-crowd"
version = "0.2.0"
description = "Make every record one of a crowd, and measure it: deterministic, offline k-anonymity for CSV, JSON and XML tables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kai IWASAKI" }]
dependencies = []

[project.scripts]
sieve-crowd = "sieve_crowd.cli:main"

[tool.setuptools]
packages = ["sieve_crowd"]
